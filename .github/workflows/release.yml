name: Shorebird Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave empty to use pubspec.yaml version, e.g. 1.0.0+1)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1


      - name: Build Shorebird Release APK
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            shorebird release android --artifact=apk --split-per-abi=false --force --release-version="${{ github.event.inputs.version }}"
          else
            shorebird release android --artifact=apk --split-per-abi=false --force
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || format('v{0}', github.run_number) }}
          name: Release ${{ github.event.inputs.version != '' && github.event.inputs.version || format('v{0}', github.run_number) }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
